<style>
  :root{
    --bg:#0b1020; --bg2:#111832; --card:#151d3b; --text:#e8ecf8; --muted:#9aa6c7;
    --accent:#4f8cff; --accent2:#22d3a6; --border:#243056;
  }
  :root[data-theme="light"]{
    --bg:#f6f8fd; --bg2:#ffffff; --card:#ffffff; --text:#101a33; --muted:#57648a;
    --accent:#2457d6; --accent2:#0e9f7e; --border:#dbe2f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  nav{display:flex;align-items:center;justify-content:space-between;height:62px}
  .logo{font-weight:800;letter-spacing:.3px;color:var(--text)}
  .logo span{color:var(--accent)}
  .links{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .links a{color:var(--muted);font-size:.93rem}
  .links a:hover{color:var(--text);text-decoration:none}
  .theme{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.9rem}
  .hero{padding:84px 0 64px;display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center}
  .badge{display:inline-block;border:1px solid var(--border);background:var(--bg2);color:var(--accent2);padding:5px 12px;border-radius:999px;font-size:.82rem;margin-bottom:18px}
  h1{font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.12;margin-bottom:14px}
  h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--muted);font-size:1.08rem;max-width:560px;margin-bottom:26px}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:11px 20px;border-radius:10px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff}
  .btn:hover{text-decoration:none;filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
  .avatar{justify-self:center;width:230px;height:230px;border-radius:50%;border:3px solid var(--accent);overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:4rem;font-weight:800}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  section{padding:64px 0;border-top:1px solid var(--border)}
  h2{font-size:1.7rem;margin-bottom:8px}
  .sub{color:var(--muted);margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
  .card h3{font-size:1.1rem;margin-bottom:6px}
  .card p,.card li{color:var(--muted);font-size:.96rem}
  .card ul{padding-left:18px;margin-top:8px}
  .card li{margin-bottom:5px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .tag{font-size:.78rem;border:1px solid var(--border);background:var(--bg2);color:var(--muted);padding:3px 10px;border-radius:999px}
  .timeline{border-left:2px solid var(--border);padding-left:22px;display:grid;gap:22px}
  .item{position:relative}
  .item::before{content:"";position:absolute;left:-29px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .item .when{color:var(--accent2);font-size:.85rem;font-weight:600}
  .item h3{font-size:1.1rem}
  .item .org{color:var(--muted);margin-bottom:6px}
  .item ul{padding-left:18px;color:var(--muted);font-size:.96rem}
  .item li{margin-bottom:4px}
  .pub{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .status{white-space:nowrap;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--accent2);color:var(--accent2)}
  .status.review{border-color:var(--accent);color:var(--accent)}
  .contact-box{text-align:center}
  .contact-box p{color:var(--muted);max-width:520px;margin:0 auto 22px}
  footer{text-align:center;color:var(--muted);font-size:.86rem;padding:28px 0;border-top:1px solid var(--border)}
  @media(max-width:760px){
    .hero{grid-template-columns:1fr;padding-top:48px;text-align:left}
    .avatar{width:170px;height:170px;font-size:3rem;order:-1;justify-self:start}
    .links a.hide-m{display:none}
  }

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  try { var saved = localStorage.getItem('theme'); if (saved) root.setAttribute('data-theme', saved); } catch(e){}
  btn.addEventListener('click', function(){
